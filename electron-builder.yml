appId: "dev.noxara.launcher"
productName: "Noxara Launcher"
version: "0.1.0"

win:
  target: nsis
  artifactName: "Noxara-Launcher-${version}-Setup.exe"
  nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallDir: true
    installerIcon: "assets/icons/icon.ico"
    uninstallerIcon: "assets/icons/icon.ico"
    menuCategory: true
    output: "dist/"
  # Skip code signing for beta release
  # certificateFile: null
  # signingHashAlgorithms: sha256

linux:
  target: [AppImage, deb]

mac:
  target: dmg

files:
  - "dist/**/*"
  - "assets/**/*"
  - "native/rust/target/release/noxara-core"