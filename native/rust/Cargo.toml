[package]
name = "noxara-core"
version = "0.1.0"
edition = "2021"
description = "Noxara Launcher native core: Minecraft version resolution, Java detection, downloads, and process launching. Speaks JSON-RPC over stdio to the Electron main process."
license = "MIT"
authors = ["Glocky Yuzei"]

[[bin]]
name = "noxara-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "fs", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
sha1 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
dirs = "5"
which = "6"
zip = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
